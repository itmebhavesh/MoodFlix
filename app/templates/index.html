<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121212">
  <title>MoodFlix – Movies, mood quiz &amp; more</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/moodflix.css') }}">
</head>
<body>
  <header class="nav">
    <div class="nav-in">
      <a class="logo" href="#home" aria-label="MoodFlix home">MoodFlix</a>
      <form class="search" id="searchForm" role="search">
        <input id="q" type="search" placeholder="Search title, genre, actor, language" aria-label="Search movies" autocomplete="off">
        <button type="submit" aria-label="Search">&#128269;</button>
      </form>
      <a class="wl" href="#library-watchlist" aria-label="Watchlist">&#128278; <span>Watchlist</span> <b id="wlCount" hidden>0</b></a>
      <div class="authbox" id="authBox"></div>
    </div>
    <nav class="subnav" aria-label="Sections">
      <a href="#home">Home</a>
      <a href="#discover" class="quizlink">&#127919; Discover</a>
      <a href="#taste">&#128156; My Taste</a>
      <a href="#library">&#128218; My Library</a>
    </nav>
  </header>
  <main id="app" tabindex="-1" aria-live="polite"></main>
  <footer class="foot">MoodFlix &middot; mood se movie guess &middot; ratings &amp; posters via OMDb, India OTT via Watchmode</footer>
  <script src="{{ url_for('static', filename='js/core.js') }}" defer></script>
  <script src="{{ url_for('static', filename='js/browse.js') }}" defer></script>
  <script src="{{ url_for('static', filename='js/discover.js') }}" defer></script>
  <script src="{{ url_for('static', filename='js/recommender.js') }}" defer></script>
</body>
</html>
